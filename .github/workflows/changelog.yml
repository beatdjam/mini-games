name: Changelog

# ゲームのフォルダを触ったコミットに Changelog 行（または `Changelog: なし`）があるかを確かめる
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changelog 行の確認
        run: python3 tools/check_changelog.py "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
