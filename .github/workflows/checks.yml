name: Checks

# PR ごとに、公開ジョブ（pages.yml）と同じ確認を流す。マージしてから公開ジョブで落ちて公開が止まる、を防ぐため。
# 公開ジョブでも同じ確認をもう一度流す（PR どうしの組み合わせで master が壊れたときに、公開しないため）
on:
  pull_request:

permissions:
  contents: read

# 同じ PR に続けて push したら、古いほうの実行は止める
concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: スタイルと文言の確認（tools/check_style.js、tools/check_i18n.js）
        run: npm run lint
      - name: テスト（engine のテストと各ゲームのスモーク。開発サーバーと、テスト用ビルドの両方）
        # ランナーの Chrome は google-chrome
        env:
          CHROME: google-chrome
        run: |
          npm test
          npm run test:build
      - name: 公開用のビルド
        run: npm run build
