# ジョブは 3 段: 確認（check）→ Chromium のテスト（e2e、matrix の 5 本が並ぶ）→ 公開（deploy）。
# 確認と公開を別のジョブにしているのは、公開の手順だけが GitHub 側の失敗で落ちたときに、
# 「落ちたジョブを流し直す」で、テストをやり直さずに公開だけを流し直すため。
# Chromium のテストも別のジョブにしているのは、待ち時間を縮めるのと、e2e が落ちたときにそのジョブだけ流し直せるようにするため
# （重い STORMBREACHER と SDX は、--shard でそれぞれ 2 本に割る。分け方は checks.yml の先頭のコメントと同じ）。
# check は型チェック、lint、node の層のテスト、ビルドのテスト。deploy は check と e2e の全部を待つ
name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# 権限は各ジョブに付ける（既定は読み取りだけ）
permissions:
  contents: read

# 新しい push が来たら、実行中の公開も止めて最新だけを回す（テストが長いので、続けてマージすると待ちが積み上がる）。
# 止められた公開は build_updates.py が成功の公開として数えないので、その分のコミットは次の公開の更新履歴に入る
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 型チェック
        run: |
          npm ci
          npm run typecheck
      - name: 書式・スタイル・文言の確認（Prettier、ESLint、tools/check_style.js、tools/check_i18n.js）
        run: npm run lint
      - name: テスト（node の層。ページを使わないテスト）
        # 全部を一度に流すと、node の層と Chromium が CPU を取り合って、重いテストが 5 秒の上限を超える（#509〜#511 で落ちた）。
        # Chromium の層は、別のジョブ（e2e）に分けてある
        run: npx vitest run --project '*-unit' --project '*-integration'
      - name: テスト（ビルドのテスト。公開用のビルドを Chromium で開く）
        # ランナーの Chrome を使う。結果はジョブのサマリに出る
        env:
          CHROME: /usr/bin/google-chrome
        run: npm run test:build
      - name: テストのレポートを保存（失敗したときも）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-check
          path: test-results/
          if-no-files-found: ignore

  e2e:
    # Chromium の層。matrix の行ごとに別の runner で並べて流す。失敗したら公開しない
    name: e2e (${{ matrix.name }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 1 本が落ちても、ほかの本は流し切る（落ちたものだけ流し直せるように）
      matrix:
        include:
          - name: stormbreacher-1
            args: --project stormbreacher-e2e --shard=1/2
          - name: stormbreacher-2
            args: --project stormbreacher-e2e --shard=2/2
          - name: sector-dive-ex-1
            args: --project sector-dive-ex --shard=1/2
          - name: sector-dive-ex-2
            args: --project sector-dive-ex --shard=2/2
          - name: others # 残りの Chromium のプロジェクト全部
            args: --project !*-unit --project !*-integration --project !stormbreacher-e2e --project !sector-dive-ex
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: テスト（Chromium の層）
        env:
          CHROME: /usr/bin/google-chrome
          VITEST_ARGS: ${{ matrix.args }}
        run: |
          set -f # '!*-unit' のような引数を、シェルに展開させない
          npx vitest run $VITEST_ARGS
      - name: テストのレポートを保存（失敗したときも）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.name }}
          path: test-results/
          if-no-files-found: ignore

  deploy:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read   # 更新履歴の生成で、過去の公開の実行履歴を読む
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # push ごとにコミットを分けるので全履歴が要る
      - name: 各ゲームの更新履歴を生成
        # 失敗しても公開は止めない（その場合はコミット済みのページがそのまま出る）
        continue-on-error: true
        run: python3 tools/build_updates.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ビルド（Vite。dist/ に出力し、版番号を書き込む。確認用のコードは入らない）
        run: npm run build
      - uses: actions/configure-pages@v5
      # 同じ run を流し直すと前の回の github-pages が残り、deploy-pages が「artifact が 2 つ」で落ちる。
      # 流し直しの回ごとに名前を変え、deploy-pages にも同じ名前を渡す
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
