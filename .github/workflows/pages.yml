name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # 更新履歴の生成で、過去の公開の実行履歴を読む

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # push ごとにコミットを分けるので全履歴が要る
      - name: 各ゲームの更新履歴を生成
        # 失敗しても公開は止めない（その場合はコミット済みのページがそのまま出る）
        continue-on-error: true
        run: python3 tools/build_updates.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 型チェック
        run: |
          npm ci
          npm run typecheck
      - name: 書式・スタイル・文言の確認（Prettier、tools/check_style.js、tools/check_i18n.js）
        run: npm run lint
      - name: テスト（engine のテストと各ゲームのスモークは Vitest。ビルドのテストは公開用のビルドを Chromium で開く）
        # 失敗したら公開しない。ランナーの Chrome を使う。結果はジョブのサマリに出る
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          npm test
          npm run test:build
      - name: テストのレポートを保存（失敗したときも）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results/
          if-no-files-found: ignore
      - name: ビルド（Vite。dist/ に出力し、版番号を書き込む。確認用のコードは入らない）
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
