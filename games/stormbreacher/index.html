<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="劣勢の戦線を、組み替えた機体で押し返す三人称のロボットアクション（開発中）" data-i18n-content="meta.description">
<meta name="build" content="dev">
<!-- unlisted until the top page links it (M1, D-03): the page stays out of search results -->
<meta name="robots" content="noindex">
<title>STORMBREACHER</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:dark}
/* the hidden attribute wins over a display set below (#sbApp is flex) */
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:#000;color:#e8eef2;
  overflow:hidden;overscroll-behavior:none;
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#sbApp{
  position:fixed;inset:0;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  pointer-events:none;
}
#sbApp .title{font-size:clamp(18px,4.2vmin,34px);font-weight:700;letter-spacing:.12em;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.7)}
#sbApp .status{font-size:clamp(11px,2vmin,16px);letter-spacing:.16em;color:#ffcf6a;text-shadow:0 1px 6px rgba(0,0,0,.7)}
#sbApp a{
  pointer-events:auto;
  font-size:clamp(11px,2vmin,15px);color:#cfe4ef;text-decoration:none;
  border-bottom:1px solid rgba(207,228,239,.5);text-shadow:0 1px 6px rgba(0,0,0,.7);
}
#sbApp button{
  pointer-events:auto;padding:0;font:inherit;
  font-size:clamp(11px,2vmin,15px);color:#cfe4ef;background:none;border:0;
  border-bottom:1px solid rgba(207,228,239,.5);text-shadow:0 1px 6px rgba(0,0,0,.7);cursor:pointer;
}
/* fullscreen (any screen): the top right corner, above the HUD's radar and the touch layer */
#sbFs{
  position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));right:max(24px,env(safe-area-inset-right));
  padding:3px 10px;font:inherit;font-size:clamp(11px,1.8vmin,14px);color:#cfe4ef;cursor:pointer;
  background:rgba(10,17,25,.55);border:1px solid rgba(213,228,238,.35);border-radius:4px;
}
/* pause (any sortie): the top left corner, clear of the HUD's objective below it and the fullscreen button */
#sbPauseBtn{
  position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));left:max(24px,env(safe-area-inset-left));
  padding:3px 10px;font:inherit;font-size:clamp(11px,1.8vmin,14px);color:#cfe4ef;cursor:pointer;
  background:rgba(10,17,25,.55);border:1px solid rgba(213,228,238,.35);border-radius:4px;
}
#sbResult,#sbPause{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(5,8,12,.72);text-align:center;
}
#sbPause{z-index:6}
#sbResult .title,#sbPause .title{font-size:clamp(24px,6vmin,48px);font-weight:700;letter-spacing:.16em;text-shadow:0 2px 8px rgba(0,0,0,.7)}
#sbResultPay{display:flex;flex-direction:column;gap:2px}
#sbResult p{margin:0;font-size:clamp(13px,2.4vmin,18px);color:#cfe4ef}
#sbResult button,#sbPause button{
  min-width:140px;height:40px;padding:0 14px;font:inherit;font-size:14px;color:#e8eef2;
  border:1px solid rgba(213,228,238,.35);background:rgba(10,17,25,.7);cursor:pointer;
}
/* touch (SB-030): the engine's stick and view drag, the mech's buttons and the layout editor. #touch stays hidden
   unless a dev view shows it. */
#touch{position:fixed;inset:0;touch-action:none;z-index:3}
#joyBase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border:1px solid rgba(84,232,255,.45);border-radius:50%;background:rgba(84,232,255,.06);display:none;pointer-events:none}
#joyKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(84,232,255,.35);border:1px solid #54e8ff}
.tbtn{position:absolute;width:64px;height:64px;padding:0;border-radius:50%;border:1px solid rgba(213,228,238,.35);background:rgba(10,17,25,.55);color:#e8eef2;font:inherit;font-size:12px;display:grid;place-items:center;touch-action:none;line-height:1.2;text-align:center}
.tbtn.down,.tbtn:active{background:rgba(84,232,255,.25);border-color:#54e8ff}
.tbtn.on{border-color:#ffcf6a;color:#ffcf6a}
/* applyLayout() puts the button's centre at left / top */
.tbtn[data-lb]{transform:translate(-50%,-50%)}
#btnFire{font-size:14px;border-color:rgba(255,120,120,.8);background:rgba(70,16,20,.6)}
#btnFire2{font-size:12px;border-color:rgba(255,120,120,.6);background:rgba(55,16,20,.55)}
#touch.editing{background:rgba(5,8,12,.5)}
#touch.editing .tbtn[data-lb]{border-style:dashed;cursor:move}
#touch.editing .tbtn.sel{border-color:#ffcf6a;box-shadow:0 0 0 2px #ffcf6a}
#layoutBar{position:absolute;z-index:5;left:50%;top:calc(env(safe-area-inset-top,0px) + 52px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 10px;background:rgba(10,17,25,.85);border:1px solid rgba(213,228,238,.25)}
#layoutBar[hidden]{display:none}
#layoutBar p{margin:0;width:100%;text-align:center;font-size:12px;color:#a9bfcc}
#layoutBar b{color:#ffcf6a;font-weight:400}
#layoutBar button{min-width:52px;height:34px;padding:0 10px;border-radius:4px;border:1px solid rgba(213,228,238,.35);background:rgba(10,17,25,.7);color:#e8eef2;font:inherit;font-size:12px;touch-action:none}
#layoutBar button:active{background:rgba(84,232,255,.25)}
#layoutBar button.amber{border-color:#ffcf6a;color:#ffcf6a}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="sbApp">
  <div class="title" data-i18n="app.title">STORMBREACHER</div>
  <div class="status" data-i18n="app.status"></div>
  <a href="../../" data-i18n="app.back"></a>
  <button id="sbStart" type="button" data-i18n="app.start"></button>
  <button id="sbContinue" type="button" data-i18n="app.continue" hidden></button>
</div>
<button id="sbFs" type="button" hidden></button>
<button id="sbPauseBtn" type="button" data-noskip data-i18n="pause.button" hidden></button>
<div id="sbPause" data-noskip hidden>
  <div class="title" data-i18n="pause.title"></div>
  <button id="sbPauseResume" type="button" data-i18n="pause.resume"></button>
  <button id="sbPauseSuspend" type="button" data-i18n="pause.suspend"></button>
  <button id="sbPauseAbandon" type="button" data-i18n="pause.abandon"></button>
  <button id="sbAbandonYes" type="button" data-i18n="pause.abandonYes" hidden></button>
  <button id="sbAbandonNo" type="button" data-i18n="pause.abandonNo" hidden></button>
</div>
<div id="sbResult" hidden>
  <div class="title" data-i18n="result.title"></div>
  <p id="sbResultTime"></p>
  <div id="sbResultPay" hidden></div>
  <button id="sbResultCheckpoint" type="button" data-i18n="result.checkpoint"></button>
  <button id="sbResultRestart" type="button" data-i18n="result.restart"></button>
  <button id="sbResultBack" type="button" data-i18n="result.back"></button>
</div>
<div id="touch" hidden>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <button id="btnFire" class="tbtn" data-lb="main" data-i18n="btn.main"></button>
  <button id="btnFire2" class="tbtn" data-lb="sub" data-i18n="btn.sub"></button>
  <button id="btnJump" class="tbtn" data-lb="jump" data-i18n="btn.jump"></button>
  <button id="btnBoost" class="tbtn" data-lb="boost" data-i18n="btn.boost"></button>
  <button id="btnLock" class="tbtn" data-lb="lock" data-i18n="btn.lock"></button>
  <div id="layoutBar" hidden>
    <p><span data-i18n="layout.help"></span><b id="lbName"></b></p>
    <button type="button" data-lbact="minus" data-i18n="layout.minus"></button>
    <button type="button" data-lbact="plus" data-i18n="layout.plus"></button>
    <button type="button" data-lbact="reset" data-i18n="layout.reset"></button>
    <button type="button" class="amber" data-lbact="done" data-i18n="layout.done"></button>
  </div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
