<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sector Dive Extended の更新履歴">
<title>Sector Dive Extended 更新履歴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=DotGothic16&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#05080c; --panel:#0a1119; --line:#1b2a38; --text:#d5e4ee; --dim:#7f94a6; --cyan:#54e8ff; --amber:#ffc24a; --lime:#8cff6a; --mag:#ff4d8d;
  --disp:"Chakra Petch","DotGothic16","Hiragino Sans",system-ui,sans-serif;
  --jp:"DotGothic16","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--jp);font-size:15px;line-height:1.75;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto;padding-block:32px 64px;display:grid;gap:28px}
nav{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
nav a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}
nav a:hover{color:var(--text)}
header{display:grid;gap:6px}
.eyebrow{margin:0;font-family:var(--disp);font-size:12px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
h1{margin:0;font-family:var(--disp);font-weight:700;font-size:clamp(28px,6vw,44px);letter-spacing:.1em;line-height:1.1}
h1 span{color:var(--cyan)}
header p{margin:0;color:var(--dim);font-size:14px}
.day{margin:8px 0 -12px;font-family:var(--disp);font-size:14px;font-weight:500;letter-spacing:.14em;color:var(--dim)}
.list{display:grid;gap:10px}
.release{display:grid;gap:6px;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line)}
.release.latest{border-left-color:var(--cyan)}
.rhead{display:flex;gap:12px;align-items:baseline}
.date{font-family:var(--disp);font-size:15px;color:var(--cyan);font-variant-numeric:tabular-nums}
.sha{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim)}
.release ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.release li::marker{color:var(--dim)}
.tag{display:inline-block;font-size:11px;padding:0 6px;margin-right:6px;border:1px solid var(--line);color:var(--dim);vertical-align:1px}
.tag.new{color:var(--lime);border-color:#35602a}
.tag.fix{color:var(--mag);border-color:#5a2238}
.tag.bal{color:var(--amber);border-color:#5a4418}
footer{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<main>
  <nav><a href="./">← ゲームへ</a><a href="../../">ゲーム一覧</a></nav>
  <header>
    <p class="eyebrow">update log</p>
    <h1>SECTOR<span>/</span>DIVE 更新履歴</h1>
    <p>公開（push）ごと、新しい順。<span class="tag new">追加</span>新機能 <span class="tag bal">調整</span>バランスや見た目の変更 <span class="tag fix">修正</span>不具合の修正</p>
  </header>

  <!-- updates:start（tools/build_updates.py が生成。手で編集しない） -->
  <!-- updates:end -->

  <footer>細かい仕様は <a href="https://github.com/beatdjam/mini-games/blob/master/games/sector-dive-ex/SPEC.md" style="color:inherit">SPEC.md</a> にまとめてある。</footer>
</main>
</body>
</html>
