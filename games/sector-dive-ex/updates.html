<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sector Dive Extended の更新履歴">
<title>Sector Dive Extended 更新履歴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=DotGothic16&family=Saira+Stencil+One&display=swap">
<style>
/* the field kit's look, as in the game (src/ui/hud2.css, 2026-10-18): dark steel and white paint, safety yellow the one
   colour that stands out; the labels in the stencil. The kinds of change are small marks: added in yellow, fixed in
   warning red, changed (most of the list) in worn paint, so the other two stand out */
:root{
  color-scheme:dark;
  --bg:#0a0b0b; --text:#ebe7da; --dim:#a09d92; --edge:#3d4143; --safety:#f2b705; --stop:#d8402f;
  --steel:linear-gradient(180deg,#1f2122,#161718);
  --sten:"Saira Stencil One","Chakra Petch",sans-serif;
  --disp:"Chakra Petch","DotGothic16","Hiragino Sans",system-ui,sans-serif;
  --jp:"DotGothic16","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--jp);font-size:15px;line-height:1.75;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto;padding-block:32px 64px;display:grid;gap:28px}
nav{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
nav a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--edge)}
nav a:hover{color:var(--text);border-bottom-color:var(--text)}
header{display:grid;gap:10px}
.eyebrow{justify-self:start;margin:0;padding:0 9px;border:1px solid var(--dim);font-family:var(--sten);font-size:13px;letter-spacing:.1em;color:var(--text);text-transform:uppercase}
h1{margin:0;font-family:var(--sten);font-weight:400;font-size:clamp(28px,6vw,44px);letter-spacing:.06em;line-height:1.1}
h1 span{color:var(--safety)}
h1 small{display:block;margin-top:6px;font-family:var(--jp);font-size:16px;letter-spacing:0;color:var(--dim)}
header p{margin:0;color:var(--dim);font-size:14px}
.day{margin:8px 0 -12px;font-family:var(--sten);font-size:15px;font-weight:400;letter-spacing:.08em;color:var(--dim)}
.list{display:grid;gap:10px}
.release{display:grid;gap:6px;padding:12px 16px;background:var(--steel);border:1px solid var(--edge);box-shadow:0 2px 0 rgba(0,0,0,.5)}
.release.latest{box-shadow:inset 4px 0 0 var(--safety),0 2px 0 rgba(0,0,0,.5);border-color:var(--text)}
.release ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.release li::marker{color:var(--edge)}
.tag{display:inline-block;font-size:11px;padding:0 6px;margin-right:8px;border:1px solid var(--dim);color:var(--dim);vertical-align:1px;line-height:1.6}
.tag.new{color:var(--safety);border-color:var(--safety)}
.tag.fix{color:var(--stop);border-color:var(--stop)}
.tag.bal{color:var(--dim);border-color:var(--dim)}
footer{font-size:12px;color:var(--dim)}
footer a{color:inherit}
</style>
</head>
<body>
<main>
  <nav><a href="./">← ゲームへ</a><a href="../../">ゲーム一覧</a></nav>
  <header>
    <p class="eyebrow">update log</p>
    <h1>SECTOR<span>/</span>DIVE <span>EX</span><small>更新履歴</small></h1>
    <p>最新の5件と、日付ごとのまとめ。<span class="tag new">追加</span>新機能 <span class="tag bal">調整</span>バランスや見た目の変更 <span class="tag fix">修正</span>不具合の修正</p>
  </header>

  <!-- updates:start（tools/build_updates.py が生成。手で編集しない） -->
  <!-- updates:end -->

  <footer>細かい仕様は <a href="https://github.com/beatdjam/mini-games/blob/master/games/sector-dive-ex/SPEC.md">SPEC.md</a> にまとめてある。</footer>
</main>
</body>
</html>
