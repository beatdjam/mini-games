<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vimの操作を、ターミナル風の画面で問題形式の練習にする詰めvim。" data-i18n-content="meta.description">
<meta name="build" content="dev">
<meta name="theme-color" content="#070b08">
<link rel="icon" type="image/svg+xml" href="/games/tsume-vim/icon.svg">
<title>詰めvim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#070b08; --panel:#0a120c; --panel2:#0d1710; --line:#1d3222; --line2:#2c4d35;
  --text:#c9e3c2; --dim:#6f8a72; --green:#9fe870; --amber:#ffcf6a; --red:#ff8a78; --cyan:#7ad9d0;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --jp:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;line-height:1.55;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:90;pointer-events:none;opacity:.055;
  background:repeating-linear-gradient(180deg,#fff 0 1px,transparent 1px 3px)}
body::after{content:"";position:fixed;inset:0;z-index:89;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%,transparent 40%,rgba(0,0,0,.45) 100%)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
::selection{background:var(--green);color:#071008}

#tvApp{position:relative;z-index:1;display:grid;grid-template-rows:auto 1fr;height:100dvh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px;padding:0 14px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0b140e,#081009)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;min-width:0}
.brand .logo{display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--line2);color:var(--green);font-weight:700}
.brand b{display:block;font-size:16px;letter-spacing:.08em;line-height:1.1}
.brand i{display:block;font-style:normal;font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.topright{display:flex;align-items:center;gap:10px;min-width:0}
.progress{font-size:12px;color:var(--dim);white-space:nowrap}
.btn{border:1px solid var(--line2);background:#0c170f;color:var(--text);padding:7px 13px;font-size:13px;letter-spacing:.03em}
.btn:hover,.btn:focus-visible{border-color:var(--green);color:var(--green);outline:none}
.btn.small{padding:5px 10px;font-size:12px}
.btn.tiny{padding:3px 9px;font-size:12px}
.btn.ghost{background:transparent;color:var(--dim)}
.btn.active{border-color:var(--amber);color:var(--amber)}
.btn.ghost:hover{color:var(--text)}

.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:0}
.levels{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:12px 10px 24px}
.levels-head{font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;padding:0 6px 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.chapterbox{margin:14px 0 4px}
.chapterbox:first-of-type{margin-top:2px}
.chapterhead{display:flex;align-items:baseline;gap:8px;padding:0 6px}
.chapterhead b{font-size:12px;color:var(--amber);letter-spacing:.08em;font-weight:600}
.chapterhead span{font-size:12px;color:var(--text)}
.chapterintro{margin:3px 6px 7px;font-family:var(--jp);font-size:11px;line-height:1.7;color:var(--dim)}
.lv{display:grid;grid-template-columns:24px minmax(0,1fr) 28px;align-items:center;gap:6px;width:100%;
  border:0;border-left:2px solid transparent;background:transparent;padding:5px 6px;text-align:left;color:var(--dim);font-size:12px}
.lv:hover{background:#102015;color:var(--text)}
.lv.active{background:#13251a;border-left-color:var(--green);color:var(--text)}
.lv .num{font-size:11px;color:var(--dim);text-align:right}
.lv .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv .mark{font-size:10px;text-align:right;color:#3d5a44}
.lv.done .mark{color:var(--green)}
.lv.active .num{color:var(--green)}

.game{display:flex;flex-direction:column;gap:9px;min-height:0;padding:13px 16px 9px;overflow:auto}
.task{min-height:60px}
.chapter{display:inline-block;margin:0 0 4px;font-size:11px;letter-spacing:.16em;color:var(--amber);text-transform:uppercase}
.task h1{margin:0;font-size:20px;line-height:1.25;font-weight:600;letter-spacing:.02em}
.brief{margin:4px 0 0;font-family:var(--jp);font-size:13px;line-height:1.7;color:var(--dim)}

.panes{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:9px;flex:1;min-height:170px}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid var(--line);background:var(--panel)}
.pane.goal{border-color:#3c3520;background:#0d110b}
.panehead{display:flex;align-items:center;justify-content:space-between;gap:8px;height:28px;padding:0 9px;
  border-bottom:1px solid var(--line);background:#0b150e;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.goal .panehead{background:#11140d;border-bottom-color:#3c3520}
.panehead .fname{color:#51705a;letter-spacing:.04em;text-transform:none}
.panehead .note{color:#8a7a4e;letter-spacing:.02em;text-transform:none;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buffer{position:relative;flex:1;overflow:auto;padding:8px 0 10px;font-size:13px;line-height:1.62;white-space:pre;user-select:none}
.line{display:grid;grid-template-columns:4.6ch minmax(0,1fr);min-height:1.62em}
.line.curline{background:#0e1d13}
.line.vline{background:#1a2d1f}
.ln{color:#3d5a44;text-align:right;padding-right:1ch;font-size:11px;user-select:none}
.ln .mark{color:var(--amber);font-size:9px;margin-left:2px}
.tx{white-space:pre;padding-right:6px}
.goal .ln{color:#5b5130}
.goal .tx{color:#e6d9ae}
.cur{background:var(--green);color:#071008}
.cur.ins{display:inline-block;width:0;overflow:visible;border-left:2px solid var(--green);background:transparent;margin-left:-1px}
.sel{background:#2b4d33;color:#e6ffe0}
.gcur{background:var(--amber);color:#1a1205}
.trail{color:#33513b}
.vline .tx{background:#1a2d1f}

.statusline{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:#142318;padding:3px 9px;
  font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden}
.statusline .mode{font-weight:700;letter-spacing:.12em;color:var(--green);min-width:12ch}
.statusline .mode.insert{color:var(--amber)}
.statusline .mode.visual,.statusline .mode.visual-line{color:var(--cyan)}
.statusline .mode.search,.statusline .mode.command{color:var(--amber)}
.statusline .search{color:var(--amber);font-weight:600}
.statusline .notice{color:var(--red);font-weight:600}
.statusline .fname{color:#7f9c85}
.statusline .spacer{flex:1}
#tvBest{color:var(--amber)}

.below{display:flex;gap:9px;align-items:stretch}
.hintbox{flex:1;min-width:0;border:1px solid var(--line);border-left:2px solid var(--amber);background:#0d150c;padding:7px 10px 8px}
.hintbox h2{margin:0 0 3px;font-size:10px;letter-spacing:.18em;color:var(--amber);text-transform:uppercase}
.hintbox p{margin:0;font-family:var(--jp);font-size:12px;line-height:1.7;color:#b8ccb3}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.solution{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
kbd{display:inline-block;min-width:1.6em;padding:1px 5px;border:1px solid var(--line2);border-bottom-color:#4a7352;
  background:#101d13;color:var(--green);font-family:var(--mono);font-size:11px;line-height:1.5;text-align:center}
.done{flex:1.15;min-width:0;display:flex;align-items:center;gap:12px;border:1px solid #3e6b46;background:linear-gradient(160deg,#0f2013,#0b160d);
  padding:9px 12px;box-shadow:inset 0 0 24px rgba(159,232,112,.05)}
.done .ok{display:grid;place-items:center;width:44px;height:44px;flex:none;border:1px solid var(--green);color:var(--green);
  font-size:16px;font-weight:700;letter-spacing:.08em;box-shadow:0 0 18px rgba(159,232,112,.15)}
.done h2{margin:0;font-size:15px;color:var(--green);letter-spacing:.04em}
.done p{margin:2px 0 0;font-family:var(--jp);font-size:12px;line-height:1.65;color:#bdd6b7}
.done .stats{margin-top:4px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.done .row{margin-top:5px}
.foot{display:flex;justify-content:space-between;gap:12px;color:#4f6a55;font-size:10px;letter-spacing:.03em;padding:0 1px}

.helpdlg{width:min(760px,92vw);max-height:86dvh;border:1px solid var(--line2);background:#0b140e;color:var(--text);padding:0;overflow:auto;
  box-shadow:0 30px 90px #000c}
.helpdlg::backdrop{background:rgba(2,6,3,.78)}
.helpdlg header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;border-bottom:1px solid var(--line);background:#0b140e}
.helpdlg h2{margin:0;font-size:15px;letter-spacing:.08em}
.helpdlg .note{margin:10px 16px 0;font-family:var(--jp);font-size:12px;color:var(--dim)}
.helpdlg dl{display:grid;grid-template-columns:minmax(9ch,auto) 1fr;gap:0;margin:10px 16px 18px;border-top:1px solid var(--line)}
.helpdlg dt,.helpdlg dd{margin:0;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px}
.helpdlg dt{color:var(--green);white-space:nowrap}
.helpdlg dd{font-family:var(--jp);color:#b8ccb3}

#tvApp.endless .levels{display:none}
#tvApp.endless .shell{grid-template-columns:1fr}
#tvApp.endless #tvLevelsToggle{display:none}

#tvTouch{display:none}
@media (pointer:coarse){#tvTouch{display:inline;color:var(--amber)}}

@media (max-width:1000px){
  .topbar{height:auto;min-height:48px;padding:7px 10px;flex-wrap:wrap}
  .topright{width:100%;justify-content:space-between}
  .shell{grid-template-columns:1fr}
  .levels{display:none;position:fixed;z-index:60;inset:48px auto 0 0;width:min(320px,86vw);box-shadow:18px 0 50px #000a}
  #tvApp.levels-open .levels{display:block}
  .panes{grid-template-columns:1fr;min-height:0}
  .game{overflow:auto}
  .pane{min-height:150px}
  .below{flex-direction:column}
  .statusline{flex-wrap:wrap;gap:6px 12px}
  .statusline .spacer{display:none}
}
@media (max-width:620px){
  .brand i{display:none}
  .task h1{font-size:17px}
  .buffer{font-size:12px}
  .done{align-items:flex-start}
  .done .ok{width:36px;height:36px;font-size:13px}
  .foot{flex-direction:column;gap:2px}
}
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="tvApp">
  <header class="topbar">
    <a class="brand" href="../../" aria-label="mini-games">
      <span class="logo">⌁</span>
      <span><b data-i18n="app.title">詰めvim</b><i data-i18n="app.tagline">practice terminal</i></span>
    </a>
    <div class="topright">
      <span id="tvProgress" class="progress"></span>
      <button id="tvEndless" class="btn small" data-i18n="nav.endless">エンドレス</button>
      <button id="tvLevelsToggle" class="btn small" data-i18n="nav.levels">問題一覧</button>
      <button id="tvHelp" class="btn small" data-i18n="nav.help">キー一覧</button>
    </div>
  </header>
  <div class="shell">
    <aside id="tvLevels" class="levels">
      <div class="levels-head" data-i18n="levels.title">問題一覧</div>
      <div id="tvLevelList"></div>
    </aside>
    <main class="game">
      <section class="task">
        <p id="tvChapter" class="chapter"></p>
        <h1 id="tvTitle"></h1>
        <p id="tvBrief" class="brief"></p>
      </section>
      <div class="panes">
        <section class="pane">
          <header class="panehead"><span data-i18n="pane.current">いま</span><span class="fname" data-i18n="status.file">practice.txt</span></header>
          <div id="tvBuffer" class="buffer" tabindex="0" role="textbox" aria-readonly="true"></div>
        </section>
        <section class="pane goal">
          <header class="panehead"><span data-i18n="pane.goal">お題</span><span id="tvGoalNote" class="note"></span></header>
          <div id="tvGoal" class="buffer"></div>
        </section>
      </div>
      <div class="statusline">
        <span id="tvMode" class="mode"></span>
        <span id="tvSearch" class="search" hidden></span>
        <span id="tvNotice" class="notice" hidden></span>
        <span class="fname" data-i18n="status.file">practice.txt</span>
        <span id="tvPos"></span>
        <span id="tvKeys"></span>
        <span class="spacer"></span>
        <span id="tvBest"></span>
      </div>
      <div class="below">
        <section class="hintbox">
          <h2 data-i18n="hint.title">ヒント</h2>
          <p id="tvHint"></p>
          <div class="row">
            <button id="tvSolution" class="btn tiny" data-i18n="hint.show">手順を見る</button>
            <span id="tvSolutionKeys" class="solution" hidden></span>
          </div>
        </section>
        <section id="tvDone" class="done" hidden>
          <div class="ok">OK</div>
          <div>
            <h2 id="tvDoneTitle"></h2>
            <p id="tvDoneText"></p>
            <p id="tvDoneStats" class="stats"></p>
            <div class="row">
              <button id="tvNext" class="btn"></button>
              <button id="tvRetry" class="btn ghost"></button>
            </div>
          </div>
        </section>
      </div>
      <footer class="foot">
        <span data-i18n="legend">h j k l 移動 · i 入力 · Esc 戻る · u 元に戻す</span>
        <span id="tvTouch" data-i18n="touch.notice"></span>
      </footer>
    </main>
  </div>
</div>

<dialog id="tvHelpDlg" class="helpdlg">
  <header>
    <h2 data-i18n="help.title">キー一覧</h2>
    <button id="tvHelpClose" class="btn tiny" data-i18n="help.close">閉じる</button>
  </header>
  <p class="note" data-i18n="help.note"></p>
  <dl id="tvHelpList"></dl>
</dialog>

<noscript>このゲームは JavaScript を有効にすると遊べる。</noscript>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
