<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ブラウザで遊べる自分用ミニゲーム集">
<title>mini-games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=DotGothic16&display=swap">
<style>
:root{
  --bg:#f3f1ec; --panel:#ffffff; --line:#d9d5cc; --text:#1c1d21; --dim:#6b6a66; --accent:#0a7f94;
  --disp:"Chakra Petch","DotGothic16","Hiragino Sans",system-ui,sans-serif;
  --jp:"DotGothic16","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{color-scheme:dark;--bg:#07090d;--panel:#0d131a;--line:#1d2a36;--text:#dbe6ee;--dim:#7f93a4;--accent:#54e8ff}
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--jp);font-size:15px;line-height:1.7;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
main{max-width:880px;margin:0 auto;padding-block:48px 64px;display:grid;gap:36px}
header{display:grid;gap:8px}
.eyebrow{margin:0;font-family:var(--disp);font-size:12px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
h1{margin:0;font-family:var(--disp);font-weight:700;font-size:clamp(36px,8vw,60px);letter-spacing:.08em;line-height:1}
h1 span{color:var(--accent)}
header p{margin:0;color:var(--dim);max-width:60ch}
.games{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.game{display:grid;grid-template-rows:auto 1fr;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.game:hover,.game:focus-visible{border-color:var(--accent);transform:translateY(-2px)}
.game:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shot{aspect-ratio:16/7;max-width:100%;display:grid;place-items:center;border-bottom:1px solid var(--line);font-family:var(--disp);font-weight:700;letter-spacing:.16em;font-size:22px}
.body{display:grid;gap:6px;padding:14px 16px 16px;align-content:start}
.name{font-size:18px}
.desc{margin:0;font-size:13px;color:var(--dim)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tags li{list-style:none;font-size:11px;padding:1px 8px;border:1px solid var(--line);color:var(--dim)}
.tags{padding:0;margin-bottom:0}
footer{font-size:12px;color:var(--dim)}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){.game{transition:none}.game:hover{transform:none}}
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">browser mini games</p>
    <h1>mini<span>-</span>games</h1>
    <p>ブラウザだけで遊べる自分用のミニゲーム集。スマホでもPCでも動く。</p>
  </header>

  <ul class="games">
    <li>
      <a class="game" href="games/sector-dive/">
        <div class="shot" style="background:radial-gradient(circle at 70% 40%,#123a45,#05080c 70%);color:#54e8ff">SECTOR/DIVE</div>
        <div class="body">
          <span class="name">Sector Dive</span>
          <p class="desc">ランダム生成の区画を潜るローグライトFPS。6種のセクターと6体のボスが毎回違う順番で出る。ボスを倒したら帰還か前進かを選び、拾った武器を持ち帰って拠点を強化する。</p>
          <ul class="tags"><li>3D FPS</li><li>ローグライト</li><li>スマホ対応</li></ul>
        </div>
      </a>
    </li>
  </ul>

  <footer>セーブデータは各ゲームごとにブラウザ内（localStorage）に保存される。 <a href="https://github.com/beatdjam/mini-games">GitHub</a></footer>
</main>
</body>
</html>
